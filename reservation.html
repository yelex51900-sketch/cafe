<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f4f0e8"><meta name="description" content="喫茶店 ○○ のご来店予約フォーム。"><title>RESERVATION | 喫茶店 ○○</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"><script src="assets/script.js" defer></script></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">木</span><span>喫茶店 <b>○○</b></span></a><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="global-nav" aria-label="メニューを開く"><span></span><span></span></button><nav id="global-nav" class="global-nav" aria-label="メインナビゲーション"><a href="index.html">HOME</a><a href="menu.html">MENU</a><a href="concept.html">CONCEPT</a><a href="access.html">ACCESS</a><a class="nav-reserve" href="reservation.html" aria-current="page">ご来店予約 <span>↗</span></a></nav></header><main><section class="page-hero"><p class="eyebrow">RESERVATION</p><h1>席をご予約。</h1><p class="page-hero-sub">ご来店予約</p></section><section class="reservation-wrap section-wrap"><div class="reservation-intro"><p class="eyebrow">TAKE YOUR TIME</p><h2>ご予約フォーム</h2><p>下記をご入力ください。<br>こちらはポートフォリオ用のデモフォームです。<br>実際の予約送信は行われません。</p></div><form id="reservation-form" class="reservation-form"><label for="guest-name">お名前 <span>必須</span></label><input id="guest-name" name="name" autocomplete="name" required maxlength="80" placeholder="山田 花子"><label for="guest-email">メールアドレス <span>必須</span></label><input id="guest-email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="hello@example.com"><div class="form-row"><div><label for="visit-date">ご来店日 <span>必須</span></label><input id="visit-date" name="date" type="date" required></div><div><label for="visit-time">ご来店時間 <span>必須</span></label><select id="visit-time" name="time" required><option value="">選択してください</option><option>11:00</option><option>12:00</option><option>13:00</option><option>14:00</option><option>15:00</option><option>16:00</option><option>17:00</option><option>18:00</option></select></div></div><label for="guest-count">人数 <span>必須</span></label><select id="guest-count" name="guests" required><option value="">選択してください</option><option value="1">1名</option><option value="2">2名</option><option value="3">3名</option><option value="4">4名</option><option value="5">5名以上（要相談）</option></select><label for="request-note">ご要望（任意）</label><textarea id="request-note" name="note" rows="3" maxlength="500" placeholder="ご要望があればご記入ください"></textarea><label class="consent"><input type="checkbox" id="demo-consent" required><span>デモフォームであり、実際の予約は送信されないことを確認しました。</span></label><button class="button-link form-submit" type="submit">入力内容を確認する <span>↗</span></button><p id="form-message" class="form-message" role="status" aria-live="polite"></p></form></section></main><footer class="site-footer"><a class="brand brand-footer" href="index.html"><span class="brand-mark">木</span><span>喫茶店 <b>○○</b></span></a><p>© 2026 KISSA ○○</p><div><a href="menu.html">MENU</a><a href="access.html">ACCESS</a><a href="reservation.html">RESERVATION</a></div></footer></body></html>
